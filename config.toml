baseURL = 'https://your-vercel-url.vercel.app/'
languageCode = 'en-us'
title = 'prnvdsi-blog'
theme = 'hugo-bearblog'

[params]
  # The description of your site.
  description = "A very minimal blog written from the terminal."
  favicon = "favicon.svg"
  
  # The text that shows in the header.
  title = "prnvdsi-blog"
  
  # Optional author info
  author = "Terminal User"

  # Since terminal browsers don't do CSS images/backgrounds,
  # keeping everything purely text-based ensures perfect lynx/w3m support.
  hide_reply_by_email = true

[menu]
  # Add terminal-friendly navigation links
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2

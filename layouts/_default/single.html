{{ define "main" }}
<table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td>
            <h2>{{ .Title }}</h2>
            <div class="subtext" style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 5px;">
                posted {{ .Date.Format "Jan 02, 2006" }}
            </div>
        </td>
    </tr>
    <tr>
        <td>
            {{ .Content }}
        </td>
    </tr>
    <tr>
        <td style="padding-top: 30px;">
            <a href="/" class="subtext">&lt;&lt; back home</a>
        </td>
    </tr>
</table>
{{ end }}

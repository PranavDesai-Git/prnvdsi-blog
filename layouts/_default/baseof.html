<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: Verdana, Geneva, sans-serif; 
            font-size: 10pt; 
            color: #828282; 
            background-color: #000000; /* HackerNews dark mode style */
            margin: 0;
        }
        a { color: #aaaaaa; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .hnmain { background-color: #121211; width: 85%; margin: auto; }
        @media only screen and (max-width: 750px) { .hnmain { width: 100%; } }
        .header { background-color: #ff6600; padding: 2px; }
        .header a { color: #000000; font-weight: bold; }
        .header-title { font-weight: bold; color: #000000; }
        .content { padding: 10px; color: #cccccc; }
        .content a { color: #ffffff; }
        .subtext { font-size: 8pt; color: #828282; }
    </style>
</head>
<body>
<table border="0" cellpadding="0" cellspacing="0" width="100%">
  <tr>
    <!-- Left Margin -->
    <td width="10%"></td>
    <!-- Main Content -->
    <td width="80%">
        <table class="hnmain" border="0" cellpadding="0" cellspacing="0" width="100%">
            <!-- Header -->
            <tr>
                <td class="header">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%">
                        <tr>
                            <td style="width:18px; padding-right:4px">
                                <!-- fake icon space -->
                                <b style="color:#000;">[*]</b>
                            </td>
                            <td style="line-height:12pt; height:10px;">
                                <span class="header-title"><a href="/">{{ .Site.Title }}</a></span>
                                &nbsp;|&nbsp;
                                <a href="/blog/">new</a>
                                &nbsp;|&nbsp;
                                <a href="/about/">about</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr style="height:10px"></tr>
            <!-- Main Content -->
            <tr>
                <td class="content">
                    {{ block "main" . }}{{ end }}
                </td>
            </tr>
            <tr style="height:10px"></tr>
            <!-- Footer -->
            <tr>
                <td style="padding: 10px; text-align: center; border-top: 1px solid #333;">
                    <span class="subtext">Operated via Terminal. Built with Hugo.</span>
                </td>
            </tr>
        </table>
    </td>
    <!-- Right Margin -->
    <td width="10%"></td>
  </tr>
</table>
</body>
</html>

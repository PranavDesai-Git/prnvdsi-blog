<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en-us" }}">
<head>
    <meta charset="utf-8">
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}{{ end }}">
    <style>
        :root {
            --bg: #000000;
            --text: #cccccc;
            --link: #5f87af;
            --link-hover: #87afd7;
            --nav-link: #767676;
            --nav-hover: #aaaaaa;
            --nav-sep: #444444;
            --title: #8a8a8a;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #ffffff;
                --text: #222222;
                --link: #0055aa;
                --link-hover: #003388;
                --nav-link: #666666;
                --nav-hover: #222222;
                --nav-sep: #cccccc;
                --title: #555555;
            }
        }
        
        body { 
            font-family: Verdana, sans-serif; 
            font-size: 16.5pt; 
            color: var(--text); 
            background-color: var(--bg); 
            margin: 0;
            line-height: 1.6;
        }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; color: var(--link-hover); }
        .hnmain { background-color: var(--bg); width: 100%; max-width: 65ch; margin: auto; }
        @media only screen and (max-width: 750px) { .hnmain { width: 90%; } }
        
        .header { padding: 60px 0 40px 0; }
        .header a { color: var(--nav-link); text-decoration: none; font-size: 14pt; padding: 0 8px; }
        .header a:hover { color: var(--nav-hover); }
        .header .sep { color: var(--nav-sep); }
        .header-title a { color: var(--title); padding-left: 0; }
        
        .content { padding: 0 0 40px 0; }
        .subtext { font-size: 12pt; color: var(--nav-link); }
        
        pre {
            padding: 15px;
            border: 4px double var(--text);
            border-radius: 0;
            background-color: transparent !important;
            overflow-x: auto;
        }
        code, pre code {
            font-family: monospace;
            background-color: transparent !important;
        }
    </style>
</head>
<body>
<table border="0" cellpadding="0" cellspacing="0" width="100%">
  <tr>
    <td width="10%"></td>
    <td width="80%">
        <table class="hnmain" border="0" cellpadding="0" cellspacing="0" width="100%">
            <!-- Header -->
            <tr>
                <td class="header">
                    <span class="header-title"><a href="/">prnvdsi-blog</a></span>
                    <span class="sep" aria-hidden="true">/</span>
                    <a href="https://github.com/PranavDesai-Git" target="_blank" rel="noopener noreferrer">github</a>
                    <span class="sep" aria-hidden="true">/</span>
                    <a href="https://www.linkedin.com/in/pranav-desai-542961385/" target="_blank" rel="noopener noreferrer">linkedin</a>
                    <span class="sep" aria-hidden="true">/</span>
                    <a href="https://x.com/prnvdsi" target="_blank" rel="noopener noreferrer">twitter</a>
                    <span class="sep" aria-hidden="true">/</span>
                    <a href="https://pranavdesai.vercel.app/" target="_blank" rel="noopener noreferrer">portfolio</a>
                </td>
            </tr>
            <!-- Main Content -->
            <tr>
                <td class="content">
                    {{ block "main" . }}{{ end }}
                </td>
            </tr>
            <!-- Footer -->
            <tr>
                <td style="padding: 20px 0; text-align: left;">
                    <span class="subtext">Operated via Terminal. Built with Hugo.</span>
                </td>
            </tr>
        </table>
    </td>
    <td width="10%"></td>
  </tr>
</table>
</body>
</html>

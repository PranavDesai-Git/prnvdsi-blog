            .highlight {
                filter: invert(1) hue-rotate(180deg);

        body {

            overflow-x: hidden;
        }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; color: var(--link-hover); }
        
        .hnmain { background-color: var(--bg); width: 100%; max-width: 65ch; margin: auto; table-layout: fixed; }
        @media only screen and (max-width: 750px) { .hnmain { width: 90%; } }
        
        .header { padding: 60px 0 40px 0; }
        .header a { color: var(--nav-link); text-decoration: none; font-size: 14pt; padding: 0 8px; }
        .header a:hover { color: var(--nav-hover); }
        .header .sep { color: var(--nav-sep); }
        .header-title a { color: var(--title); padding-left: 0; }
        
        .content { padding: 0 0 40px 0; overflow-wrap: break-word; word-wrap: break-word; }
        .subtext { font-size: 12pt; color: var(--nav-link); }
        
        img { max-width: 100%; height: auto; display: block; }
        
        td { max-width: 100vw; }
        
        pre {
            padding: 15px 0;
            background-color: transparent !important;
            overflow-x: auto;
            max-width: 100%;
            font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, "DejaVu Sans Mono", monospace;
            tab-size: 4;
            -moz-tab-size: 4;
            line-height: 1;
            white-space: pre;
            word-wrap: normal;
            overflow-wrap: normal;
        }
        .highlight {
            max-width: 100%;
            overflow-x: auto;
        }
        .highlight pre {
            padding: 15px;
            border: 4px double var(--text);
            border-radius: 0;
        }
        code, pre code {
            font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, "DejaVu Sans Mono", monospace;
            background-color: transparent !important;
            tab-size: 4;
            -moz-tab-size: 4;
            line-height: 1;
            white-space: pre;
            word-wrap: normal;
            overflow-wrap: normal;
        }
        @media (max-width: 600px) {
            pre, code, .highlight pre {
                font-size: 0.85em;
